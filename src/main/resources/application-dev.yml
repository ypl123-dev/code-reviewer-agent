spring:
  # H2 内存数据库 - 零外部依赖
  datasource:
    url: jdbc:h2:mem:code_reviewer;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  # 禁用 RabbitMQ / Redis / PgVector 自动配置（dev 用本地替代）
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

  # Spring AI - DeepSeek (通过 OpenAI 兼容协议)
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.3
          max-tokens: 4000

# 业务配置（dev 模式：禁用外部服务）
code-reviewer:
  git:
    platform: gitea
    base-url: ${GITEA_URL:http://localhost:3000}
    token: ${GITEA_TOKEN:dev-token}
    webhook-secret: ${GITEA_WEBHOOK_SECRET:}
  review:
    max-token-per-chunk: 4000
    context-lines: 10
    max-files-per-review: 30
  rag:
    top-k: 3
    candidate-count: 10
    rerank-url: http://localhost:9090/rerank
    enabled: false  # dev 禁用重排序，避免依赖 BGE 服务
  ratelimit:
    capacity: 10
    rate: 2

logging:
  level:
    com.example: DEBUG
    org.springframework.ai: INFO
    org.hibernate.SQL: WARN

# 暴露所有 actuator 端点（dev 调试用）
management:
  endpoints:
    web:
      exposure:
        include: "*"
